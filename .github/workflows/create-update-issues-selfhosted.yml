name: Create or Update WCAG Violation Issues (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date to publish (YYYY-MM-DD). Leave empty to use the latest available date.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Log planned issue changes without writing issues or pushing to gh-pages'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      report_date:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  create-or-update-issues:
    runs-on: self-hosted
    timeout-minutes: 120
    concurrency:
      group: wcag-issues
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub issues for violations
        id: issues
        uses: actions/github-script@v9
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const embeddedCode = require(path.join(process.cwd(), 'js', 'embedded-code.js'));

            const { owner, repo } = context.repo;
            const REPORTS_DIR = 'accessibility-reports';
            const SUMMARIES_DIR = path.join(REPORTS_DIR, 'summaries');
            const MARKDOWN_DIR = 'issues-markdown';
            const PAGES_URL = `https://${owner}.github.io/${repo}`;
            const VIOLATION_LABEL = 'wcag-violation';
            const SUMMARY_LABEL = 'wcag-summary';
            const AUTOMATED_LABEL = 'automated-report';
            const SUMMARY_TITLE = 'WCAG Daily Summary Report';
            const MAX_BODY_LENGTH = 65000; // GitHub limit is 65536
            const WRITE_DELAY_MS = 1000; // stay below the secondary rate limit for content creation
            const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
            const API_VERSION_HEADERS = { 'X-GitHub-Api-Version': '2022-11-28' };
            const dryRun = process.env.DRY_RUN === 'true';
            const requestedDate = (process.env.REPORT_DATE || '').trim();
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stats = { created: 0, updated: 0, unchanged: 0, closed: 0, skipped: 0, errors: [] };

            // ---------- Report date ----------
            const availableDates = fs.readdirSync(REPORTS_DIR, { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && DATE_RE.test(entry.name))
              .map((entry) => entry.name)
              .sort();
            if (availableDates.length === 0) {
              core.setFailed(`No dated report folders found in ${REPORTS_DIR}.`);
              return;
            }
            if (requestedDate && (!DATE_RE.test(requestedDate) || !availableDates.includes(requestedDate))) {
              core.setFailed(`Report date "${requestedDate}" is not available. Latest dates: ${availableDates.slice(-5).join(', ')}`);
              return;
            }
            const reportDate = requestedDate || availableDates[availableDates.length - 1];
            core.setOutput('report_date', reportDate);
            core.info(`Using reports from ${reportDate}${dryRun ? ' (dry run)' : ''}.`);

            // ---------- Helpers ----------
            const issueTitle = (project) => `[${project}] WCAG Violations Report`;
            const sanitizeFilename = (name) => name.replace(/[^a-z0-9_\-]/gi, '_');
            const labelNames = (issue) => issue.labels.map((label) => (typeof label === 'string' ? label : label.name));
            const escapeCell = (text) => String(text ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');
            const formatTarget = (node) => `\`${(node.target || []).flat(Infinity).join(', ')}\``;
            const getViolationSource = (violation, reportUrl) => {
              const analysis = embeddedCode.analyzeReport({
                url: reportUrl,
                violations: [violation],
              });
              if (analysis.count > 0) {
                return analysis.providers.length
                  ? `Embedded code from ${analysis.providers.join(' and ')}`
                  : 'Embedded code';
              }
              return 'Page content';
            };

            function truncateBody(body) {
              if (body.length <= MAX_BODY_LENGTH) return body;
              const notice = '\n\n---\n\n**⚠️ This issue body was truncated due to size limitations.**\n\nThe full report is available in the markdown file linked above.';
              return body.substring(0, MAX_BODY_LENGTH - notice.length) + notice;
            }

            async function write(description, fn) {
              if (dryRun) {
                core.info(`[dry-run] ${description}`);
                return null;
              }
              for (let attempt = 1; ; attempt++) {
                try {
                  const result = await fn();
                  await sleep(WRITE_DELAY_MS);
                  return result;
                } catch (error) {
                  const rateLimited = (error.status === 403 || error.status === 429) && /rate limit/i.test(error.message);
                  const retryable = rateLimited || error.status >= 500;
                  if (!retryable || attempt >= 4) throw error;
                  const waitSeconds = Number(error.response?.headers?.['retry-after']) || 60 * attempt;
                  core.warning(`${description} failed with ${error.status}; retrying in ${waitSeconds}s (attempt ${attempt}/3)`);
                  await sleep(waitSeconds * 1000);
                }
              }
            }

            // ---------- Existing issues (fetched once) ----------
            const issuesByTitle = new Map();
            // The REST list endpoint can omit issues (stale index), so list issues via GraphQL instead.
            async function listAllIssues(states) {
              const query = `query($owner: String!, $repo: String!, $states: [IssueState!], $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  issues(first: 50, after: $cursor, states: $states) {
                    pageInfo { hasNextPage endCursor }
                    nodes { id number title body state labels(first: 100) { nodes { name } } }
                  }
                }
              }`;
              const issues = [];
              let cursor = null;
              do {
                const { repository } = await github.graphql(query, { owner, repo, states, cursor });
                for (const node of repository.issues.nodes) {
                  issues.push({
                    node_id: node.id,
                    number: node.number,
                    title: node.title,
                    body: node.body,
                    state: node.state.toLowerCase(),
                    labels: node.labels.nodes.map((label) => ({ name: label.name })),
                  });
                }
                cursor = repository.issues.pageInfo.hasNextPage ? repository.issues.pageInfo.endCursor : null;
              } while (cursor);
              return issues;
            }

            const existingIssues = await listAllIssues(['OPEN', 'CLOSED']);
            for (const issue of existingIssues) {
              const list = issuesByTitle.get(issue.title) || [];
              list.push(issue);
              issuesByTitle.set(issue.title, list);
            }
            core.info(`Loaded ${existingIssues.length} existing issues.`);

            function findIssue(title) {
              const matches = (issuesByTitle.get(title) || []).sort((a, b) => b.number - a.number);
              if (matches.length > 1) {
                core.warning(`Found ${matches.length} issues titled "${title}" (${matches.map((i) => `#${i.number}`).join(', ')}); using the newest open one.`);
              }
              return matches.find((issue) => issue.state === 'open') || matches[0] || null;
            }

            async function upsertIssue(title, body, labels) {
              const existing = findIssue(title);
              if (!existing) {
                const created = await write(`create "${title}"`, () => github.rest.issues.create({ owner, repo, title, body, labels, headers: API_VERSION_HEADERS }));
                if (created) issuesByTitle.set(title, [created.data]);
                stats.created++;
                core.info(`Created issue "${title}"${created ? ` #${created.data.number}` : ''}.`);
                return;
              }
              const sameLabels = JSON.stringify(labelNames(existing).sort()) === JSON.stringify([...labels].sort());
              if (existing.state === 'open' && (existing.body || '') === body && sameLabels) {
                stats.unchanged++;
                return;
              }
              await write(`update #${existing.number} "${title}"`, () => github.rest.issues.update({
                owner, repo, issue_number: existing.number, body, labels, state: 'open', headers: API_VERSION_HEADERS,
              }));
              stats.updated++;
              core.info(`Updated issue #${existing.number} "${title}".`);
            }

            async function closeResolvedIssue(project) {
              const existing = findIssue(issueTitle(project));
              if (existing && existing.state === 'open') {
                await write(`close #${existing.number} "${existing.title}"`, () => github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed', headers: API_VERSION_HEADERS,
                }));
                stats.closed++;
                core.info(`Closed issue #${existing.number} for ${project} (0 violations).`);
              }
              const markdownPath = path.join(MARKDOWN_DIR, `${sanitizeFilename(project)}.md`);
              if (!dryRun && fs.existsSync(markdownPath)) fs.rmSync(markdownPath);
            }

            // ---------- Select the latest usable report per project ----------
            const reportDir = path.join(REPORTS_DIR, reportDate);
            const latestByProject = new Map();
            const unusableProjects = new Set();
            for (const file of fs.readdirSync(reportDir).filter((name) => name.startsWith('violations-') && name.endsWith('.json'))) {
              let report;
              try {
                report = JSON.parse(fs.readFileSync(path.join(reportDir, file), 'utf8'));
              } catch (error) {
                core.warning(`Skipping unreadable report ${file}: ${error.message}`);
                continue;
              }
              if (!report || typeof report.project !== 'string' || !Array.isArray(report.violations)) {
                core.warning(`Skipping ${file}: invalid structure.`);
                continue;
              }
              const unusable = report.skipped || report.failed || report.total_violations == null || /-(SKIPPED|FAILED)\.json$/.test(file);
              if (unusable) {
                unusableProjects.add(report.project);
                continue;
              }
              const current = latestByProject.get(report.project);
              if (!current || String(report.timestamp) > String(current.timestamp)) {
                latestByProject.set(report.project, report);
              }
            }
            const skippedProjects = [...unusableProjects].filter((project) => !latestByProject.has(project)).sort();
            stats.skipped = skippedProjects.length;
            if (skippedProjects.length) {
              core.info(`Leaving issues untouched for skipped/failed scans: ${skippedProjects.join(', ')}`);
            }

            // ---------- Project issues ----------
            if (!dryRun) fs.mkdirSync(MARKDOWN_DIR, { recursive: true });
            let projectsWithViolations = 0;
            let totalViolations = 0;

            for (const report of [...latestByProject.values()].sort((a, b) => a.project.localeCompare(b.project))) {
              const { project, timestamp, url, total_violations } = report;
              try {
                const violations = report.violations.filter((violation) => violation && violation.violation_count > 0);
                if (violations.length === 0) {
                  await closeResolvedIssue(project);
                  continue;
                }
                projectsWithViolations++;
                totalViolations += Number(total_violations) || 0;

                const markdownFilename = `${sanitizeFilename(project)}.md`;
                const markdown = [
                  `# WCAG Violations Report for ${project}`,
                  '',
                  `**Timestamp:** ${timestamp}`,
                  `**URL:** [${url}](${url})`,
                  `**Total Violations:** ${total_violations}`,
                  '',
                  '## Violation Details',
                  '',
                  ...violations.flatMap((violation) => [
                    `### ${violation.help || 'Violation'}`,
                    '',
                    `- **Impact:** ${violation.impact || 'N/A'}`,
                    `- **Description:** ${violation.description || 'N/A'}`,
                    `- **Source:** ${getViolationSource(violation, url)}`,
                    `- **Help URL:** ${violation.helpUrl || 'N/A'}`,
                    `- **Tags:** ${violation.tags ? violation.tags.join(', ') : 'N/A'}`,
                    `- **Count:** ${violation.violation_count}`,
                    '',
                    '#### Affected Elements:',
                    '',
                    ...(violation.nodes || []).map((node) => `- ${formatTarget(node)}`),
                    '',
                  ]),
                ].join('\n');
                if (!dryRun) fs.writeFileSync(path.join(MARKDOWN_DIR, markdownFilename), markdown, 'utf8');

                const body = truncateBody([
                  `## WCAG Violations Report for ${project}`,
                  '',
                  `📥 **[Download Full Report (Markdown)](${PAGES_URL}/issues-markdown/${markdownFilename})**`,
                  '',
                  `**Timestamp:** ${timestamp}`,
                  `**URL:** [${url}](${url})`,
                  `**Total Violations:** ${total_violations}`,
                  '',
                  '### Violation Details:',
                  '',
                  ...violations.flatMap((violation) => [
                    `- **Impact:** ${violation.impact || 'N/A'}`,
                    `- **Description:** ${violation.description || 'N/A'}`,
                    `- **Source:** ${getViolationSource(violation, url)}`,
                    `- **Help:** ${violation.help || 'N/A'}`,
                    `- **Help URL:** ${violation.helpUrl || 'N/A'}`,
                    `- **Tags:** ${violation.tags ? violation.tags.join(', ') : 'N/A'}`,
                    `- **Count:** ${violation.violation_count}`,
                    `- **Affected Elements:**`,
                    ...(violation.nodes || []).map((node) => `  - ${formatTarget(node)}`),
                    '',
                  ]),
                ].join('\n'));

                const labels = [...new Set([
                  VIOLATION_LABEL,
                  AUTOMATED_LABEL,
                  ...violations.flatMap((violation) => (Array.isArray(violation.tags) ? violation.tags : [])),
                ])].filter((label) => label.length <= 50);

                await upsertIssue(issueTitle(project), body, labels);
              } catch (error) {
                stats.errors.push(`${project}: ${error.message}`);
                core.error(`Failed to process ${project}: ${error.message}`);
              }
            }

            // ---------- Daily summary issue ----------
            try {
              const summaryFile = path.join(SUMMARIES_DIR, reportDate, 'daily_summary.json');
              const summary = fs.existsSync(summaryFile) ? JSON.parse(fs.readFileSync(summaryFile, 'utf8')) : {};
              if (!fs.existsSync(summaryFile)) core.warning(`No daily summary found at ${summaryFile}; summary issue will omit rule and tag tables.`);
              const rules = (summary.rule_ids || []).slice().sort((a, b) => (b.urls?.length || 0) - (a.urls?.length || 0));
              const tags = (summary.tags || []).slice().sort((a, b) => (b.urls?.length || 0) - (a.urls?.length || 0));

              const body = truncateBody([
                `## ${SUMMARY_TITLE}`,
                '',
                `**Date:** ${reportDate}`,
                `**Projects scanned:** ${latestByProject.size}`,
                `**Projects with violations:** ${projectsWithViolations}`,
                `**Projects without violations:** ${latestByProject.size - projectsWithViolations}`,
                `**Skipped or failed scans:** ${skippedProjects.length}`,
                `**Total violations:** ${totalViolations}`,
                '',
                `📊 [Leaderboard](${PAGES_URL}/)`,
                '',
                ...(rules.length ? [
                  '### Rules by number of affected sites',
                  '',
                  '| Rule | Description | Sites |',
                  '| --- | --- | ---: |',
                  ...rules.map((rule) => `| \`${escapeCell(rule.rule_id)}\` | ${escapeCell(rule.help || rule.description)} | ${rule.urls?.length || 0} |`),
                  '',
                ] : []),
                ...(tags.length ? [
                  '### Tags by number of affected sites',
                  '',
                  '| Tag | Sites |',
                  '| --- | ---: |',
                  ...tags.map((tag) => `| \`${escapeCell(tag.tag)}\` | ${tag.urls?.length || 0} |`),
                  '',
                ] : []),
                ...(skippedProjects.length ? ['### Skipped or failed scans', '', ...skippedProjects.map((project) => `- ${project}`), ''] : []),
              ].join('\n'));

              await upsertIssue(SUMMARY_TITLE, body, [SUMMARY_LABEL, AUTOMATED_LABEL]);
            } catch (error) {
              stats.errors.push(`Daily summary: ${error.message}`);
              core.error(`Failed to process daily summary: ${error.message}`);
            }

            // ---------- Report ----------
            await core.summary
              .addHeading(`WCAG issues for ${reportDate}${dryRun ? ' (dry run)' : ''}`)
              .addTable([
                [{ data: 'Result', header: true }, { data: 'Count', header: true }],
                ['Projects with a usable report', String(latestByProject.size)],
                ['Issues created', String(stats.created)],
                ['Issues updated', String(stats.updated)],
                ['Issues unchanged', String(stats.unchanged)],
                ['Issues closed (0 violations)', String(stats.closed)],
                ['Projects skipped (skipped/failed scan)', String(stats.skipped)],
                ['Errors', String(stats.errors.length)],
              ])
              .write();

            if (stats.errors.length) {
              core.setFailed(`${stats.errors.length} error(s):\n${stats.errors.join('\n')}`);
            }

      - name: Commit and push markdown files to gh-pages
        if: ${{ !inputs.dry_run && !cancelled() }}
        env:
          REPORT_DATE: ${{ steps.issues.outputs.report_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -d issues-markdown ]; then
            echo "No markdown directory; nothing to commit."
            exit 0
          fi

          git add -A issues-markdown/
          if git diff --cached --quiet; then
            echo "No markdown changes to commit."
            exit 0
          fi

          git commit -m "Update WCAG violation markdown reports for ${REPORT_DATE} [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              echo "Markdown reports pushed to gh-pages."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto the latest gh-pages."
            git fetch --deepen=50 origin gh-pages
            git rebase origin/gh-pages || { git rebase --abort; exit 1; }
            sleep $((attempt * 10))
          done

          echo "Failed to push markdown reports after 3 attempts."
          exit 1
