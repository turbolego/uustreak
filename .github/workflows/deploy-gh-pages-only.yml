name: Deploy to GitHub Pages (Static Files Only)
on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-static-deploy
  cancel-in-progress: false

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          submodules: false

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-branch
          fetch-depth: 1
          submodules: false

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Copy, commit and push static files
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          TARGET="$WORKSPACE/gh-pages-branch"

          copy_static_files() {
            echo "Copying static files to gh-pages branch..."
            cd "$WORKSPACE"
            # All top-level dashboard pages, not just the index
            for page in *.html; do
              cp "$page" "$TARGET/"
              echo "  copied $page"
            done
            cp README.md favicon.ico styles.css projects.json "$TARGET/" 2>/dev/null || true
            cp robots.txt sitemap.xml llms.txt "$TARGET/" 2>/dev/null || true
            cp -r js assets .well-known "$TARGET/" 2>/dev/null || true
            echo "✅ Static files copied successfully"
          }

          copy_static_files
          cd "$TARGET"

          echo "📋 Files changed:"
          git status --short

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  No changes detected in static files"
            exit 0
          fi

          echo "✅ Changes detected, committing..."
          COMMIT_MSG="chore: update static files (HTML, CSS, JS, projects.json) [skip ci]"
          git commit -q -m "$COMMIT_MSG"

          MAX_RETRIES=3
          for i in $(seq 1 "$MAX_RETRIES"); do
            echo "Push attempt $i of $MAX_RETRIES..."
            if git push origin HEAD:gh-pages; then
              echo "✅ Successfully pushed to gh-pages"
              exit 0
            fi
            echo "⚠️  Push attempt $i failed"
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              # gh-pages may have moved (e.g. a report deploy). Start again from the latest tip.
              sleep 5
              git fetch --depth=1 origin gh-pages
              git reset -q --hard FETCH_HEAD
              copy_static_files
              cd "$TARGET"
              git add -A
              if git diff --cached --quiet; then
                echo "ℹ️  Latest gh-pages already contains these static files"
                exit 0
              fi
              git commit -q -m "$COMMIT_MSG"
            fi
          done

          echo "❌ Failed to push after $MAX_RETRIES attempts"
          exit 1

      - name: Verify deployment
        run: |
          echo "✅ GitHub Pages deployment triggered"
          echo ""
          echo "The following static files were updated on gh-pages branch:"
          echo "  - *.html (index and all dashboard pages)"
          echo "  - README.md"
          echo "  - favicon.ico"
          echo "  - styles.css"
          echo "  - projects.json (achievements data)"
          echo "  - js/ (all JavaScript files)"
          echo "  - assets/ (all asset files)"
          echo ""
          echo "Your changes should be live at:"
          echo "  https://turbolego.github.io/uustreak/"
          echo ""
          echo "Note: It may take a few minutes for GitHub Pages to rebuild"
